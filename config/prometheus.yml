global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: prismdesk
    environment: production

scrape_configs:
  - job_name: prismdesk-app
    metrics_path: /metrics
    scrape_interval: 10s
    static_configs:
      - targets:
          - prismdesk:8080
        labels:
          service: prismdesk

  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090
